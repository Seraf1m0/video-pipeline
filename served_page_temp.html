<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thumbnail Editor — 1920×1080</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a1a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar { width: 300px; min-width: 300px; background: #242424; display: flex; flex-direction: column; border-right: 1px solid #333; overflow-y: auto; }
  .panel { border-bottom: 1px solid #333; padding: 12px; }
  .panel-title { font-size: 11px; text-transform: uppercase; color: #888; letter-spacing: 1px; margin-bottom: 10px; }

  label { font-size: 12px; color: #aaa; display: block; margin-bottom: 3px; margin-top: 8px; }
  input[type=range] { width: 100%; accent-color: #4a9eff; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; background: #1a1a1a; border: 1px solid #444; color: #e0e0e0;
    padding: 5px 8px; border-radius: 4px; font-size: 12px;
  }
  textarea { resize: vertical; min-height: 60px; }
  input[type=color] { width: 36px; height: 28px; border: 1px solid #444; border-radius: 4px; cursor: pointer; background: none; padding: 1px; }

  .row { display: flex; gap: 6px; align-items: center; }
  .row label { margin: 0; white-space: nowrap; }

  .btn { background: #333; border: 1px solid #555; color: #ddd; padding: 7px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; width: 100%; margin-top: 6px; }
  .btn:hover { background: #444; }
  .btn-blue { background: #1a5fa8; border-color: #2272c3; color: #fff; }
  .btn-blue:hover { background: #2272c3; }
  .btn-green { background: #1a6e3c; border-color: #27a85c; color: #fff; }
  .btn-green:hover { background: #27a85c; }
  .btn-red { background: #6e1a1a; border-color: #a82727; color: #fff; }
  .btn-red:hover { background: #a82727; }

  /* Element list */
  #elem-list { list-style: none; }
  #elem-list li {
    padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
    display: flex; justify-content: space-between; align-items: center;
    border: 1px solid transparent; margin-bottom: 3px;
  }
  #elem-list li:hover { background: #333; }
  #elem-list li.active { background: #2a3f5f; border-color: #4a9eff; }
  #elem-list li .del-btn { color: #666; cursor: pointer; padding: 0 4px; }
  #elem-list li .del-btn:hover { color: #f55; }

  /* ── Canvas area ── */
  #canvas-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #toolbar { background: #2a2a2a; padding: 8px 12px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #333; flex-wrap: wrap; }
  #toolbar .tb-btn { background: #333; border: 1px solid #555; color: #ddd; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  #toolbar .tb-btn:hover { background: #444; }
  #canvas-wrap { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; background: #111; padding: 20px; }
  #canvas-container { position: relative; }
  canvas { display: block; cursor: crosshair; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
  #drag-overlay { position: absolute; top: 0; left: 0; pointer-events: none; }

  #inline-editor {
    position: absolute;
    display: none;
    background: rgba(0,0,0,0.6);
    border: 2px solid #4a9eff;
    border-radius: 3px;
    color: #fff;
    padding: 2px 6px;
    resize: none;
    outline: none;
    z-index: 100;
    line-height: 1.2;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(74,158,255,0.3);
  }

  /* Text drag handles */
  .text-handle {
    position: absolute;
    border: 2px dashed rgba(74,158,255,0.8);
    cursor: move;
    user-select: none;
    display: flex; align-items: center; justify-content: center;
  }
  .text-handle.active { border-color: #4a9eff; border-style: solid; }

  #status { font-size: 11px; color: #666; padding: 0 12px; }

  input[type=range]::-webkit-slider-thumb { cursor: pointer; }
  .range-row { display: flex; align-items: center; gap: 6px; }
  .range-row input[type=range] { flex: 1; }
  .range-val { font-size: 11px; color: #888; min-width: 30px; text-align: right; }

  #no-elem { color: #555; font-size: 12px; text-align: center; padding: 20px 0; }
</style>
</head>

    <label>BG Color (no image)</label>
    <input type="color" id="bg-color" value="#1a1a1a" onchange="redraw()">
  </div>

      <input type="range" id="fx-brightness" min="10" max="200" value="100" oninput="updateFxLabel(this,'lbl-brightness');redraw()">
      <span class="range-val" id="lbl-brightness">100%</span>
    </div>
    <div class="range-row">
      <label style="min-width:80px">Contrast</label>
      <input type="range" id="fx-contrast" min="10" max="200" value="100" oninput="updateFxLabel(this,'lbl-contrast');redraw()">
      <span class="range-val" id="lbl-contrast">100%</span>
    </div>
    <div class="range-row">
      <label style="min-width:80px">Saturation</label>
      <input type="range" id="fx-saturation" min="0" max="300" value="100" oninput="updateFxLabel(this,'lbl-saturation');redraw()">
      <span class="range-val" id="lbl-saturation">100%</span>
    </div>
    <div class="range-row">
      <label style="min-width:80px">Blur</label>
      <input type="range" id="fx-blur" min="0" max="30" value="0" oninput="updateFxLabel(this,'lbl-blur');redraw()">
      <span class="range-val" id="lbl-blur">0</span>
    </div>
    <div class="range-row">
      <label style="min-width:80px">Vignette</label>

      <span class="range-val" id="lbl-vignette">0%</span>
    </div>
  </div>

      <span style="font-size:11px;color:#555">Loading...</span>
    </div>
  </div>

    <div class="range-row">
      <input type="range" id="ip-scale" min="5" max="500" value="100" oninput="scaleImgElem(this.value)">
      <span class="range-val" id="lbl-ip-scale">100%</span>
    </div>
    <label>Width (px at 1920×1080)</label>
    <input type="number" id="ip-width" value="300" min="10" max="1920" oninput="updateImgElem()">
    <label>Height (px at 1920×1080)</label>
    <input type="number" id="ip-height" value="300" min="10" max="1080" oninput="updateImgElem()">
    <label>Opacity %</label>
    <div class="range-row">
      <input type="range" id="ip-opacity" min="10" max="100" value="100" oninput="updateImgElem()">
      <span class="range-val" id="lbl-ip-opacity">100%</span>
    </div>
    <label>Position X (0–1920)</label>
    <input type="number" id="ip-x" value="0" oninput="updateImgElem()">
    <label>Position Y (0–1080)</label>
    <input type="number" id="ip-y" value="0" oninput="updateImgElem()">
    <button class="btn btn-red" onclick="deleteSelected()" style="margin-top:10px">🗑 Delete</button>

<script>
// ════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════
const CANVAS_W = 1920, CANVAS_H = 1080;
let zoom = 0.5;
let bgImage = null;      // HTMLImageElement
let bgData  = null;      // base64 data URL
let elements = [];       // [{id, text, font, size, color, x, y, bold, shadow, stroke_width, stroke_color, opacity}]
let selectedId = null;
let nextId = 1;

const canvas  = document.getElementById('main-canvas');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('drag-overlay');

// ════════════════════════════════════════════════════════
// Zoom
// ════════════════════════════════════════════════════════
function setZoom(z) {
  zoom = parseFloat(z);
  canvas.width  = Math.round(CANVAS_W * zoom);
  canvas.height = Math.round(CANVAS_H * zoom);
  overlay.style.width  = canvas.width  + 'px';
  overlay.style.height = canvas.height + 'px';
  redraw();
  rebuildHandles();
}

// ════════════════════════════════════════════════════════
// Overlays
// ════════════════════════════════════════════════════════
async function loadOverlayGrid() {
  const r = await fetch('/api/overlays');
  const list = await r.json();
  const grid = document.getElementById('overlay-grid');
  if (!list.length) { grid.innerHTML = '<span style="font-size:11px;color:#555">Drop PNGs into config/thumbnail_overlays/</span>'; return; }
  grid.innerHTML = '';
  for (const ov of list) {
    const btn = document.createElement('div');
    const displayLabel = ov.label || ov.name;
    btn.title = displayLabel + (ov.tags?.length ? '\n🏷 ' + ov.tags.slice(0,5).join(', ') : '');
    btn.style.cssText = 'cursor:pointer;background:#333;border:1px solid #555;border-radius:4px;padding:4px;text-align:center;width:72px;flex-shrink:0';
    btn.innerHTML = `<div style="font-size:9px;color:#aaa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${displayLabel}">${displayLabel}</div>`;
    // Lazy-load thumbnail
    const thumb = document.createElement('img');
    thumb.style.cssText = 'width:60px;height:60px;object-fit:contain;display:block;margin:0 auto 2px';
    thumb.src = '/api/overlay-img/' + encodeURIComponent(ov.file);
    btn.prepend(thumb);
    btn.onclick = () => addOverlayFromUrl('/api/overlay/' + encodeURIComponent(ov.file), displayLabel);
    btn.onmouseenter = () => btn.style.background = '#444';
    btn.onmouseleave = () => btn.style.background = '#333';
    grid.appendChild(btn);
  }
}

async function addOverlayFromUrl(apiUrl, name) {
  setStatus('Loading overlay...');
  const r = await fetch(apiUrl);
  const d = await r.json();
  if (d.error) { setStatus('Error: ' + d.error); return; }
  const img = new Image();
  img.onload = () => {
    // Scale to fit nicely: max 400px wide at 1920
    const scale = Math.min(400 / img.naturalWidth, 400 / img.naturalHeight, 1);
    const w = Math.round(img.naturalWidth * scale);
    const h = Math.round(img.naturalHeight * scale);
    const el = { id: nextId++, type: 'image', name, src: d.data,
      x: Math.round((CANVAS_W - w) / 2), y: Math.round((CANVAS_H - h) / 2),
      width: w, height: h, opacity: 100, scale: 100, _img: img };
    elements.push(el);
    selectImgElem(el.id);
    renderElemList();
    redraw();
    setStatus('Overlay added: ' + name);
  };
  img.src = d.data;
}

function loadCustomOverlay(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const src = e.target.result;
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(400 / img.naturalWidth, 400 / img.naturalHeight, 1);
      const w = Math.round(img.naturalWidth * scale);
      const h = Math.round(img.naturalHeight * scale);
      const el = { id: nextId++, type: 'image', name: file.name.replace(/\.[^.]+$/, ''),
        src, x: Math.round((CANVAS_W - w) / 2), y: Math.round((CANVAS_H - h) / 2),
        width: w, height: h, opacity: 100, scale: 100, _img: img };
      elements.push(el);
      selectImgElem(el.id);
      renderElemList();
      redraw();
    };
    img.src = src;
  };
  reader.readAsDataURL(file);
  evt.target.value = '';
}

function selectImgElem(id) {
  selectedId = id;
  const el = elements.find(e => e.id === id);
  if (!el) return;
  document.getElementById('elem-props').style.display = 'none';
  const p = document.getElementById('img-props');
  p.style.display = 'block';
  document.getElementById('ip-scale').value  = el.scale || 100;
  document.getElementById('lbl-ip-scale').textContent = (el.scale || 100) + '%';
  document.getElementById('ip-width').value  = el.width;
  document.getElementById('ip-height').value = el.height;
  document.getElementById('ip-opacity').value = el.opacity || 100;
  document.getElementById('lbl-ip-opacity').textContent = (el.opacity || 100) + '%';
  document.getElementById('ip-x').value = el.x;
  document.getElementById('ip-y').value = el.y;
  p.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  renderElemList();
  redraw();
}

function updateImgElem() {
  if (selectedId === null) return;
  const el = elements.find(e => e.id === selectedId);
  if (!el || el.type !== 'image') return;
  el.width   = parseInt(document.getElementById('ip-width').value)   || 300;
  el.height  = parseInt(document.getElementById('ip-height').value)  || 300;
  el.opacity = parseInt(document.getElementById('ip-opacity').value) || 100;
  el.x       = parseInt(document.getElementById('ip-x').value) || 0;
  el.y       = parseInt(document.getElementById('ip-y').value) || 0;
  document.getElementById('lbl-ip-opacity').textContent = el.opacity + '%';
  redraw();
}

function scaleImgElem(val) {
  if (selectedId === null) return;
  const el = elements.find(e => e.id === selectedId);
  if (!el || el.type !== 'image') return;
  const s = parseInt(val) || 100;
  el.scale = s;
  document.getElementById('lbl-ip-scale').textContent = s + '%';
  // Proportionally update width/height from natural image dimensions
  if (el._img) {
    const base = el._scaleBase || { w: el._img.naturalWidth, h: el._img.naturalHeight };
    el._scaleBase = base;
    el.width  = Math.max(10, Math.round(base.w * s / 100));
    el.height = Math.max(10, Math.round(base.h * s / 100));
    document.getElementById('ip-width').value  = el.width;
    document.getElementById('ip-height').value = el.height;
  }
  redraw();
  rebuildHandles();
}

// ════════════════════════════════════════════════════════
// Image loading
// ════════════════════════════════════════════════════════
function loadLocalImage(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    bgData = e.target.result;
    const img = new Image();
    img.onload = () => { bgImage = img; redraw(); };
    img.src = bgData;
  };
  reader.readAsDataURL(file);
}

async function loadFromPath(path) {
  closeModal();
  setStatus('Loading...');
  const r = await fetch('/api/load_image', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path})});
  const d = await r.json();
  if (d.error) { setStatus('Error: ' + d.error); return; }
  bgData = d.data;
  const img = new Image();
  img.onload = () => { bgImage = img; redraw(); setStatus('Image loaded'); };
  img.src = bgData;
}

// ════════════════════════════════════════════════════════
// Sessions modal
// ════════════════════════════════════════════════════════
async function showSessions() {
  document.getElementById('session-modal').style.display = 'flex';
  document.getElementById('session-list').innerHTML = 'Loading...';
  const r = await fetch('/api/sessions');
  const sessions = await r.json();
  if (!sessions.length) {
    document.getElementById('session-list').innerHTML = '<p style="color:#888">No sessions found.</p>';
    return;
  }
  let html = '';
  sessions.forEach(sess => {
    html += `<div style="margin-bottom:12px"><b style="color:#aaa">${sess.channel} / ${sess.session}</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">`;
    sess.photos.forEach(p => {
      const name = p.split('/').pop().split('\\').pop();
      html += `<div style="cursor:pointer;background:#333;padding:4px 8px;border-radius:4px;font-size:12px;border:1px solid #555" onclick="loadFromPath('${p.replace(/\\/g,'/')}')">${name}</div>`;
    });
    html += '</div></div>';
  });
  document.getElementById('session-list').innerHTML = html;
}

function closeModal() {
  document.getElementById('session-modal').style.display = 'none';
}

// ════════════════════════════════════════════════════════
// Drawing
// ════════════════════════════════════════════════════════
function getEffects() {
  return {
    brightness: parseInt(document.getElementById('fx-brightness').value),
    contrast:   parseInt(document.getElementById('fx-contrast').value),
    saturation: parseInt(document.getElementById('fx-saturation').value),
    blur:       parseInt(document.getElementById('fx-blur').value),
    vignette:   parseInt(document.getElementById('fx-vignette').value),
  };
}

function redraw() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  // Background
  if (bgImage) {
    // Apply CSS filters for live preview
    const fx = getEffects();
    ctx.filter = `brightness(${fx.brightness}%) contrast(${fx.contrast}%) saturate(${fx.saturation}%) blur(${fx.blur * zoom}px)`;
    ctx.drawImage(bgImage, 0, 0, w, h);
    ctx.filter = 'none';

    // Vignette
    if (fx.vignette > 0) {
      const grad = ctx.createRadialGradient(w/2, h/2, h*0.2, w/2, h/2, h*0.8);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, `rgba(0,0,0,${fx.vignette/100})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
    }
  } else {
    ctx.fillStyle = document.getElementById('bg-color').value;
    ctx.fillRect(0, 0, w, h);
  }

  // Draw all elements
  elements.forEach(el => {
    if (el.type === 'image') {
      if (!el._img) return;
      const sc = (el.scale || 100) / 100;
      ctx.save();
      ctx.globalAlpha = (el.opacity || 100) / 100;
      ctx.drawImage(el._img, el.x * zoom, el.y * zoom, el.width * zoom * sc, el.height * zoom * sc);
      ctx.restore();
    } else {
      if (_inlineEl && el.id === _inlineEl.id) return;
      drawTextElement(ctx, el, zoom);
    }
  });

  // Selection highlight
  if (selectedId !== null) {
    const el = elements.find(e => e.id === selectedId);
    if (el) {
      ctx.strokeStyle = 'rgba(74,158,255,0.8)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 3]);
      const b = getElementBBox(el);
      ctx.strokeRect(b.x - 3, b.y - 3, b.w + 6, b.h + 6);
      ctx.setLineDash([]);
    }
  }
}

function drawTextElement(ctx, el, scale) {
  const x     = el.x * scale;
  const y     = el.y * scale;
  const size  = (el.size || 80) * scale * ((el.scale || 100) / 100);
  const text  = el.text || '';
  const color = el.color || '#ffffff';
  const opacity = (el.opacity || 100) / 100;
  const strokeW = (el.stroke_width || 0) * scale;
  const shadow  = el.shadow !== false;
  const font    = `${el.bold ? 'bold ' : ''}${size}px "${el.font || 'Arial'}", Arial, sans-serif`;

  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.font = font;
  ctx.textBaseline = 'top';

  const lines = text.split('\n');
  const lineH = size * 1.2;

  lines.forEach((line, i) => {
    const ly = y + i * lineH;

    if (shadow) {
      ctx.shadowColor = 'rgba(0,0,0,0.85)';
      ctx.shadowBlur  = 8 * scale;
      ctx.shadowOffsetX = 3 * scale;
      ctx.shadowOffsetY = 3 * scale;
    }

    if (strokeW > 0) {
      ctx.strokeStyle = el.stroke_color || '#000000';
      ctx.lineWidth   = strokeW * 2;
      ctx.lineJoin    = 'round';
      ctx.shadowColor = 'transparent';
      ctx.strokeText(line, x, ly);
    }

    ctx.shadowColor   = shadow ? 'rgba(0,0,0,0.85)' : 'transparent';
    ctx.shadowBlur    = shadow ? 8 * scale : 0;
    ctx.shadowOffsetX = shadow ? 3 * scale : 0;
    ctx.shadowOffsetY = shadow ? 3 * scale : 0;
    ctx.fillStyle = color;
    ctx.fillText(line, x, ly);
  });

  ctx.restore();
}

// ════════════════════════════════════════════════════════
// Elements management
// ════════════════════════════════════════════════════════
function addElement() {
  const el = {
    id: nextId++, text: 'Your Title Here',
    font: document.getElementById('ep-font') ? document.getElementById('ep-font').options[0]?.value || 'Arial' : 'Arial',
    size: 80, color: '#ffffff',
    x: 60, y: 60,
    bold: false, shadow: true,
    stroke_width: 0, stroke_color: '#000000',
    opacity: 100, scale: 100,
  };
  elements.push(el);
  selectElement(el.id);
  renderElemList();
  redraw();
  rebuildHandles();
}

function deleteSelected() {
  if (selectedId === null) return;
  elements = elements.filter(e => e.id !== selectedId);
  selectedId = null;
  document.getElementById('elem-props').style.display = 'none';
  renderElemList();
  redraw();
  rebuildHandles();
}

function selectElement(id, focusText = false) {
  selectedId = id;
  const el = elements.find(e => e.id === id);
  if (!el) return;

  const panel = document.getElementById('elem-props');
  panel.style.display = 'block';
  const _noElem = document.getElementById('no-elem');
  if (_noElem) _noElem.style.display = 'none';

  const ta = document.getElementById('ep-text');
  ta.value = el.text;
  document.getElementById('ep-font').value         = el.font;
  document.getElementById('ep-size').value         = el.size;
  document.getElementById('ep-color').value        = el.color;
  document.getElementById('ep-stroke-color').value = el.stroke_color || '#000000';
  document.getElementById('ep-stroke-width').value = el.stroke_width || 0;
  document.getElementById('ep-bold').checked       = el.bold;
  document.getElementById('ep-shadow').checked     = el.shadow !== false;
  document.getElementById('ep-opacity').value      = el.opacity || 100;
  document.getElementById('lbl-opacity').textContent = (el.opacity || 100) + '%';
  document.getElementById('ep-scale').value        = el.scale || 100;
  document.getElementById('lbl-ep-scale').textContent = (el.scale || 100) + '%';
  document.getElementById('ep-x').value            = el.x;
  document.getElementById('ep-y').value            = el.y;

  document.getElementById('img-props').style.display = 'none';
  // Scroll sidebar so Text Properties panel is visible
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  // Focus textarea if requested (double-click)
  if (focusText) {
    setTimeout(() => { ta.focus(); ta.select(); }, 100);
  }

  renderElemList();
  redraw();
}

function updateElem() {
  if (selectedId === null) return;
  const el = elements.find(e => e.id === selectedId);
  if (!el) return;
  el.text         = document.getElementById('ep-text').value;
  el.font         = document.getElementById('ep-font').value;
  el.size         = parseInt(document.getElementById('ep-size').value) || 80;
  el.color        = document.getElementById('ep-color').value;
  el.stroke_color = document.getElementById('ep-stroke-color').value;
  el.stroke_width = parseInt(document.getElementById('ep-stroke-width').value) || 0;
  el.bold         = document.getElementById('ep-bold').checked;
  el.shadow       = document.getElementById('ep-shadow').checked;
  el.opacity      = parseInt(document.getElementById('ep-opacity').value);
  el.x            = parseInt(document.getElementById('ep-x').value) || 0;
  el.y            = parseInt(document.getElementById('ep-y').value) || 0;
  document.getElementById('lbl-opacity').textContent = el.opacity + '%';
  renderElemList();
  redraw();
  rebuildHandles();
}

function scaleTextElem(val) {
  if (selectedId === null) return;
  const el = elements.find(e => e.id === selectedId);
  if (!el) return;
  el.scale = parseInt(val) || 100;
  document.getElementById('lbl-ep-scale').textContent = el.scale + '%';
  redraw();
  rebuildHandles();
}

function renderElemList() {
  const list = document.getElementById('elem-list');
  const noEl = document.getElementById('no-elem');
  // Remove only dynamically-added items so #no-elem stays in DOM
  Array.from(list.querySelectorAll('li:not(#no-elem)')).forEach(li => li.remove());
  if (elements.length === 0) {
    if (noEl) noEl.style.display = 'block';
    return;
  }
  if (noEl) noEl.style.display = 'none';
  elements.forEach(el => {
    const li = document.createElement('li');
    li.className = el.id === selectedId ? 'active' : '';
    const label = el.type === 'image'
      ? `🖼 ${el.name || 'image'}`
      : ((el.text || '').split('\n')[0].slice(0, 22) || '(empty)');
    li.innerHTML = `<span>${label}</span><span class="del-btn" onclick="event.stopPropagation();deleteElem(${el.id})">✕</span>`;
    li.onclick = () => el.type === 'image' ? selectImgElem(el.id) : selectElement(el.id);
    list.appendChild(li);
  });
}

function deleteElem(id) {
  elements = elements.filter(e => e.id !== id);
  if (selectedId === id) {
    selectedId = null;
    document.getElementById('elem-props').style.display = 'none';
    document.getElementById('img-props').style.display = 'none';
  }
  renderElemList();
  redraw();
  rebuildHandles();
}

// ════════════════════════════════════════════════════════
// Canvas mouse interaction — click to select, drag to move
// ════════════════════════════════════════════════════════
function rebuildHandles() {} // no-op, handled via canvas directly

function getElementBBox(el) {
  if (el.type === 'image') {
    const sc = (el.scale || 100) / 100;
    return { x: el.x * zoom, y: el.y * zoom, w: el.width * zoom * sc, h: el.height * zoom * sc };
  }
  const size  = (el.size || 80) * zoom * ((el.scale || 100) / 100);
  const lines = (el.text || '').split('\n');
  const lineH = size * 1.2;
  ctx.save();
  ctx.font = `${el.bold ? 'bold ' : ''}${size}px "${el.font||'Arial'}", Arial, sans-serif`;
  const maxW = Math.max(...lines.map(l => ctx.measureText(l).width));
  ctx.restore();
  return { x: el.x * zoom, y: el.y * zoom, w: maxW + 20, h: lineH * lines.length + 10 };
}

function hitTest(mx, my) {
  // Test in reverse order (top element first)
  for (let i = elements.length - 1; i >= 0; i--) {
    const el = elements[i];
    const b  = getElementBBox(el);
    if (mx >= b.x - 10 && mx <= b.x + b.w + 10 &&
        my >= b.y - 10 && my <= b.y + b.h + 10) {
      return el;
    }
  }
  return null;
}

let _dragging = false;
let _dragEl = null, _offsetX = 0, _offsetY = 0;

canvas.style.cursor = 'default';

canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const hit = hitTest(mx, my);
  if (hit) {
    _dragging = true;
    _dragEl   = hit;
    const b  = getElementBBox(hit);
    _offsetX = mx - b.x;
    _offsetY = my - b.y;
    if (hit.type === 'image') selectImgElem(hit.id);
    else selectElement(hit.id);
    canvas.style.cursor = 'grabbing';
    e.preventDefault();
  } else {
    selectedId = null;
    document.getElementById('elem-props').style.display = 'none';
    document.getElementById('img-props').style.display = 'none';
    renderElemList();
    redraw();
  }
});

document.addEventListener('mousemove', e => {
  if (!_dragging || !_dragEl) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  _dragEl.x = Math.round((mx - _offsetX) / zoom);
  _dragEl.y = Math.round((my - _offsetY) / zoom);
  // Update whichever position fields are visible
  if (_dragEl.type === 'image') {
    document.getElementById('ip-x').value = _dragEl.x;
    document.getElementById('ip-y').value = _dragEl.y;
  } else {
    document.getElementById('ep-x').value = _dragEl.x;
    document.getElementById('ep-y').value = _dragEl.y;
  }
  redraw();
});

document.addEventListener('mouseup', () => {
  if (_dragging) { _dragging = false; _dragEl = null; canvas.style.cursor = 'default'; }
});

canvas.addEventListener('mousemove', e => {
  if (_dragging) return;
  const rect = canvas.getBoundingClientRect();
  canvas.style.cursor = hitTest(e.clientX - rect.left, e.clientY - rect.top) ? 'grab' : 'default';
});

// ════════════════════════════════════════════════════════
// Inline text editor (Photoshop-style, directly on canvas)
// ════════════════════════════════════════════════════════
const inlineEditor = document.getElementById('inline-editor');
let _inlineEl = null;

function _resizeInlineEditor() {
  inlineEditor.style.height = 'auto';
  inlineEditor.style.height = inlineEditor.scrollHeight + 'px';
}

function showInlineEditor(el) {
  _inlineEl = el;
  const fontSize = (el.size || 80) * zoom;
  const canvasW  = canvas.width;

  inlineEditor.style.left       = (el.x * zoom) + 'px';
  inlineEditor.style.top        = (el.y * zoom) + 'px';
  inlineEditor.style.fontSize   = fontSize + 'px';
  inlineEditor.style.lineHeight = '1.2';
  inlineEditor.style.fontFamily = `"${el.font || 'Arial'}", Arial, sans-serif`;
  inlineEditor.style.fontWeight = el.bold ? 'bold' : 'normal';
  inlineEditor.style.color      = el.color || '#ffffff';
  // Stay within canvas bounds
  inlineEditor.style.maxWidth   = (canvasW - el.x * zoom - 10) + 'px';
  inlineEditor.style.minWidth   = Math.min(200, canvasW * 0.4) + 'px';
  inlineEditor.style.height     = 'auto';
  inlineEditor.value            = el.text || '';
  inlineEditor.style.display    = 'block';
  _resizeInlineEditor();
  inlineEditor.focus();
  // Select all on open
  inlineEditor.setSelectionRange(0, inlineEditor.value.length);
  redraw(); // redraw so canvas doesn't show ghost text under editor
}

function hideInlineEditor() {
  if (!_inlineEl) return;
  inlineEditor.style.display = 'none';
  _inlineEl = null;
  redraw();
}

inlineEditor.addEventListener('input', () => {
  if (!_inlineEl) return;
  _inlineEl.text = inlineEditor.value;
  document.getElementById('ep-text').value = inlineEditor.value;
  _resizeInlineEditor();
  renderElemList();
  redraw();
});

inlineEditor.addEventListener('keydown', e => {
  if (e.key === 'Escape') { hideInlineEditor(); e.preventDefault(); }
});

// Prevent mousedown inside editor from bubbling to canvas (avoids re-selecting / drag)
inlineEditor.addEventListener('mousedown', e => e.stopPropagation());

// Hide when clicking outside both the editor and the canvas text
document.addEventListener('mousedown', e => {
  if (!_inlineEl) return;
  if (e.target === inlineEditor) return;
  // Clicked canvas — check if on the same element
  if (e.target === canvas) {
    const rect = canvas.getBoundingClientRect();
    const hit  = hitTest(e.clientX - rect.left, e.clientY - rect.top);
    if (hit && hit.id === _inlineEl.id) return; // same element → keep editor open
  }
  hideInlineEditor();
});

// Double-click on canvas → open inline editor (text only)
canvas.addEventListener('dblclick', e => {
  const rect = canvas.getBoundingClientRect();
  const hit  = hitTest(e.clientX - rect.left, e.clientY - rect.top);
  if (hit && hit.type !== 'image') {
    selectElement(hit.id);
    showInlineEditor(hit);
    e.preventDefault();
  }
});

// ════════════════════════════════════════════════════════
// Export
// ════════════════════════════════════════════════════════
function _serializeElements() {
  // Strip non-serializable _img field from image elements
  return elements.map(el => {
    if (el.type === 'image') {
      const { _img, ...rest } = el;
      return rest;
    }
    return el;
  });
}

async function exportPNG() {
  setStatus('Exporting...');
  const payload = {
    bg_data:     bgData || null,
    effects:     getEffects(),
    elements:    _serializeElements(),
    output_path: document.getElementById('export-path').value.trim(),
  };
  const r = await fetch('/api/export', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload),
  });
  if (!r.ok) { setStatus('Export failed'); return; }
  const blob = await r.blob();
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'thumbnail.png'; a.click();
  URL.revokeObjectURL(url);
  setStatus(`Exported (${(blob.size / 1024 / 1024).toFixed(1)} MB)`);
}

// ════════════════════════════════════════════════════════
// Utils
// ════════════════════════════════════════════════════════
function updateFxLabel(input, lblId) {
  const unit = input.id === 'fx-blur' ? '' : '%';
  document.getElementById(lblId).textContent = input.value + unit;
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

// ════════════════════════════════════════════════════════
// Project Save / Load
// ════════════════════════════════════════════════════════
function saveProject() {
  const project = {
    version: 1,
    bg_data: bgData,
    effects: getEffects(),
    elements: _serializeElements(),
    export_path: document.getElementById('export-path').value,
  };
  const blob = new Blob([JSON.stringify(project, null, 2)], {type: 'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'thumbnail_project.json';
  a.click();
  URL.revokeObjectURL(url);
  setStatus('Project saved');
}

function loadProject(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const project = JSON.parse(e.target.result);

      // Restore background
      if (project.bg_data) {
        bgData = project.bg_data;
        const img = new Image();
        img.onload = () => {
          bgImage = img;
          // Force canvas size before drawing
          canvas.width  = Math.round(CANVAS_W * zoom);
          canvas.height = Math.round(CANVAS_H * zoom);
          overlay.style.width  = canvas.width + 'px';
          overlay.style.height = canvas.height + 'px';
          redraw();
          rebuildHandles();
          setStatus('Project loaded: ' + file.name);
        };
        img.onerror = () => setStatus('ERROR: could not load background image');
        img.src = bgData;
      } else {
        bgImage = null; bgData = null;
        redraw();
      }

      // Restore effects
      const fx = project.effects || {};
      if (fx.brightness !== undefined) document.getElementById('fx-brightness').value = fx.brightness;
      if (fx.contrast   !== undefined) document.getElementById('fx-contrast').value   = fx.contrast;
      if (fx.saturation !== undefined) document.getElementById('fx-saturation').value = fx.saturation;
      if (fx.blur       !== undefined) document.getElementById('fx-blur').value       = fx.blur;
      if (fx.vignette   !== undefined) document.getElementById('fx-vignette').value   = fx.vignette;
      ['brightness','contrast','saturation','blur','vignette'].forEach(k => {
        const el = document.getElementById('fx-'+k);
        const lbl = document.getElementById('lbl-'+k);
        if (el && lbl) lbl.textContent = el.value + (k === 'blur' ? '' : '%');
      });

      // Restore elements — reload _img for image elements
      elements = project.elements || [];
      nextId = elements.length ? Math.max(...elements.map(e => e.id)) + 1 : 1;
      selectedId = null;
      document.getElementById('elem-props').style.display = 'none';
      document.getElementById('img-props').style.display = 'none';
      let imgPending = elements.filter(e => e.type === 'image' && e.src).length;
      if (imgPending === 0) { renderElemList(); redraw(); rebuildHandles(); }
      elements.forEach(el => {
        if (el.type === 'image' && el.src) {
          const img = new Image();
          img.onload = () => {
            el._img = img;
            imgPending--;
            if (imgPending === 0) { renderElemList(); redraw(); rebuildHandles(); }
          };
          img.src = el.src;
        }
      });

      // Restore export path
      if (project.export_path) document.getElementById('export-path').value = project.export_path;

      setStatus('Project loaded: ' + file.name);
    } catch(err) {
      setStatus('Error loading project: ' + err.message);
    }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

// ════════════════════════════════════════════════════════
// Init
// ════════════════════════════════════════════════════════
setZoom(0.5);
redraw();
loadOverlayGrid();
</script>
